<style>/* site.css — 일확천금 공유 디자인 토큰 + 전역 내비(gnav)

:root{--paper:#EEF0EB;--paper-2:#F7F8F5;--paper-3:#E4E7E0;--ink:#16302B;

 --sig:#B0281A;--ok:#1F6F4A;--gutter:16px;--nav-h:58px;--maxw:940px;
 --f-mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
 --f-body:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#12181A;--paper-2:#182022;--paper-3:#1F2A2C;
 --ink:#E6EDE9;--ink-60:rgba(230,237,233,.62);--ink-40:rgba(230,237,233,.40);--ink-30:rgba(230,237,233,.28);

:root[data-theme="dark"]{--paper:#12181A;--paper-2:#182022;--paper-3:#1F2A2C;--ink:#E6EDE9;
 --ink-60:rgba(230,237,233,.62);--ink-40:rgba(230,237,233,.40);--ink-30:rgba(230,237,233,.28);
 --ink-12:rgba(230,237,233,.14);--ink-06:rgba(230,237,233,.06);--sig:#FF8A78;--ok:#7FD8A8;color-scheme:dark}
html,body{overflow-x:clip}
body{background:var(--paper);color:var(--ink);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px)}
.wrap{padding-left:var(--gutter)!important;padding-right:var(--gutter)!important}
.gnav{position:fixed;inset:auto 0 0 0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);
 height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
 background:var(--paper-2);border-top:1.5px solid var(--ink)}
.gnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;
 font:700 12px/1.2 var(--f-body);color:var(--ink-60);text-decoration:none}
.gnav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.gnav a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}
:is(.gnav a,button,.btn):focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.theme-btn{font:700 11px var(--f-mono);letter-spacing:.04em;color:var(--ink-60);background:none;
 border:1px solid var(--ink-30);padding:4px 9px;cursor:pointer;border-radius:2px}
.theme-btn:hover{color:var(--ink);border-color:var(--ink)}
@media(min-width:720px){body{padding-bottom:70px}
 .gnav{position:static;display:flex;justify-content:flex-end;gap:2px;height:auto;max-width:var(--maxw);margin:0 auto;
  padding:6px var(--gutter);background:none;border:0;border-bottom:1px solid var(--ink-12)}
 .gnav a{flex-direction:row;gap:6px;padding:6px 10px;min-height:36px}
 .gnav a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--ink)}}
@media print{.gnav,.no-print{display:none!important}body{padding-bottom:0}}

body{font-family:var(--f-body);line-height:1.7}
.wrap{max-width:640px;margin:0 auto;padding:24px var(--gutter) 0}
h1{font-size:22px;padding-bottom:6px}a{color:var(--ink)}
ul{list-style:none;padding:0}li{border-bottom:1px solid var(--ink-12);padding:11px 0;font-size:14px}
