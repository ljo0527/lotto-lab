# 주간 데이터 스냅샷 (백업 경로)
#
# 이 워크플로가 없어도 사이트는 동작합니다. index.html 이 브라우저에서
# 동행복권 API 를 직접 부르기 때문입니다. 여기서 만드는 lotto-history.json 은
# 브라우저 직접 호출이 막혔을 때를 위한 안전망입니다.
#
# 주의: GitHub Actions 러너는 해외 IP 입니다. 동행복권이 해외 접근을 막으면
#       이 작업은 실패할 수 있고, 그래도 배포에는 영향이 없도록 설계했습니다.

name: Update lotto snapshot

on:
  schedule:
    - cron: '0 0 * * 0'      # 일요일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Fetch history
        id: fetch
        continue-on-error: true
        run: node scripts/fetch-history.mjs
      - name: Commit if changed
        if: steps.fetch.outcome == 'success'
        run: |
          if [ -n "$(git status --porcelain lotto-history.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lotto-history.json
            git commit -m "data: snapshot $(date -u +%Y-%m-%d)"
            git push
          else
            echo "변경 없음"
          fi
