# 자동 계산 + 배포 (한 파이프라인)
#
# push 하면 이 워크플로가 GitHub 안에서 알아서 돈다. PC 에서 따로 «갱신»할 필요가 없다.
#
#   1) compute — 동행복권 공식 API 에서 로또·연금 전 회차를 받고,
#                index.html · pension.html 을 헤드리스 크로미움에 실제로 띄워
#                추천(5,000원 = 로또 5게임 / 연금 5장)·지난주 채점·검증 보드·실구매 원장을 만든 뒤
#                바뀐 결과물만 main 에 커밋한다.
#   2) deploy  — 방금 커밋된 main 을 GitHub Pages 로 배포한다.
#                compute 가 실패해도(API 차단 등) 배포는 한다 — 사이트는 브라우저가 직접 API 를 부르므로 살아 있다.
#
# 봇 커밋은 GITHUB_TOKEN 으로 push 하므로 이 워크플로를 다시 깨우지 않는다(무한 루프 없음).
#
# 결과물을 쓰는 곳은 이제 «여기 하나»다. PC 의 push.ps1 은 올리기 전에 원격을 먼저 당겨오고,
# 결과물 파일이 충돌하면 원격(=여기서 계산한 값)을 남긴다.

name: Compute & Deploy

on:
  push:
    # main — 계산 → 커밋 → 배포 / dev/** — 계산만 해 보고 결과 요약을 주석으로 남긴다(커밋·배포 없음, 통합 테스트용)
    branches: [main, 'dev/**']
  schedule:
    # 연금복권 — 목 19:05 KST 추첨 → 목 21:30 KST, 금 09:00 KST 재확인
    - cron: '30 12 * * 4'
    - cron: '0 0 * * 5'
    # 로또 — 토 20:35 KST 추첨 → 토 22:30 KST, 일 09:00 KST 재확인
    - cron: '30 13 * * 6'
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: compute-deploy
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      # main 이면 main 끝(예약 실행 포함), dev/** 이면 그 브랜치를 계산한다
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}

      # 실명 등 금지 문자열이 추적 파일에 있으면 계산·커밋 전에 여기서 멈춘다. node 내장만 쓰므로 설치 없이 돈다.
      # 금지어 목록은 저장소에 없다(공개 저장소라 목록 자체가 이름 노출). 사람이 등록한 Actions 시크릿 CHECK_NAMES_LIST(줄바꿈 구분)에서 읽는다.
      # 시크릿이 없으면 경고만 내고 통과한다 — 없을 때 실패로 막으려면 저장소 변수 CHECK_NAMES_REQUIRE 를 1 로 둔다(소유자 결정).
      - name: 이름 검사 (scripts/check-names.mjs)
        env:
          CHECK_NAMES_LIST: ${{ secrets.CHECK_NAMES_LIST }}
          CHECK_NAMES_REQUIRE: ${{ vars.CHECK_NAMES_REQUIRE }}
        run: node scripts/check-names.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Playwright 준비
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium

      # 무한 순위 · 당첨 순위 추적 — 매 회차 모든 조합(로또 8,145,060 · 연금 5,000,000장)에 그 직전까지의 자료로 순위를 매기고
      # 실제 당첨번호가 몇 위였는지 기록(append-only). 추첨이 공정하면 당첨 백분위는 균등 — 요약은 우연 기준선과 함께.
      # 검증 보드(4층 · 순위 균등성)가 같은 실행의 결과를 읽도록 validate 보다 먼저 돈다. 데이터 캐시는 여기서 처음 만들어진다.
      - name: 당첨 순위 추적 (brief/rank-*.json)
        id: ranktrack
        env:
          NODE_OPTIONS: --max-old-space-size=6144   # 조합 814만 개 전수 표·정렬 — 기본 힙 한도에 걸리지 않게(러너 RAM 16GB)
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/rank-track.mjs --root . --out . --cache /tmp/lab-data.json 2> >(tee /tmp/rank.err >&2) || {
            echo "::error title=rank-track 실패::$(tail -c 1800 /tmp/rank.err | tr -s '\r\n' '  ')"; exit 1; }

      # 순위를 페이지 없이 독립 코드로 전수 재계산해 대조(표본 회차) + 페이지 zOf 동등성 + 통계 재계산.
      - name: 당첨 순위 독립 검증
        id: checkrank
        env:
          NODE_OPTIONS: --max-old-space-size=6144   # 조합 814만 개 전수 표·정렬 — 기본 힙 한도에 걸리지 않게(러너 RAM 16GB)
        if: steps.ranktrack.outcome == 'success'
        continue-on-error: true
        run: node scripts/check-rank.mjs --root . --cache /tmp/lab-data.json

      # 등수별 순위 분포 — 매 회차 2~5등(연금 2~7등) 당첨 조합 전체가 그 주 순위표의 어디에 있었는지(20칸) + 상관 반영 몬테카를로 귀무.
      - name: 등수별 순위 분포 (brief/rank-tiers-*.json)
        id: ranktiers
        env:
          NODE_OPTIONS: --max-old-space-size=6144   # 조합 814만 개 전수 표·정렬 — 기본 힙 한도에 걸리지 않게(러너 RAM 16GB)
        if: steps.ranktrack.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/rank-tiers.mjs --root . --out . --cache /tmp/lab-data.json 2> >(tee /tmp/tiers.err >&2) || {
            echo "::error title=rank-tiers 실패::$(tail -c 1800 /tmp/tiers.err | tr -s '\r\n' '  ')"; exit 1; }

      - name: 등수별 순위 분포 독립 검증
        id: checktiers
        env:
          NODE_OPTIONS: --max-old-space-size=6144   # 조합 814만 개 전수 표·정렬 — 기본 힙 한도에 걸리지 않게(러너 RAM 16GB)
        if: steps.ranktiers.outcome == 'success'
        continue-on-error: true
        run: node scripts/check-tiers.mjs --root . --cache /tmp/lab-data.json

      # 검증 보드를 브리핑보다 먼저 돌린다 — 브리핑의 «300주 실측 효과» 가 같은 실행의 validation.json 을 읽도록.
      # 실패하면 stderr 끝부분을 ::error:: 주석으로 올린다(공개 저장소도 로그는 로그인해야 보이지만 주석은 공개 API 로 보인다).
      # 검증이 실패해도 브리핑(이번 주 추천)은 계속 만들어 커밋하고, 잡은 마지막에 실패로 표시한다.
      - name: 검증 보드 + 실구매 원장
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate.mjs --root . --out . --window 300 --purchases brief/purchases.json --cache /tmp/lab-data.json 2> >(tee /tmp/validate.err >&2) || {
            echo "::error title=validate 실패::$(tail -c 1800 /tmp/validate.err | tr -s '\r\n' '  ')"; exit 1; }

      # 데이터는 위 단계가 받아 둔 캐시를 쓴다(검증이 데이터 수집 전에 실패했으면 여기서 직접 받는다).
      - name: 주간 브리핑 (추천 + 지난주 채점)
        id: brief
        run: |
          set -o pipefail
          node scripts/weekly-brief.mjs --root . --out . --cache /tmp/lab-data.json 2> >(tee /tmp/brief.err >&2) || {
            echo "::error title=weekly-brief 실패::$(tail -c 1800 /tmp/brief.err | tr -s '\r\n' '  ')"; exit 1; }

      # 모의 원장 — 로또 1000회·연금 100회부터 «현재 규칙대로 매주 샀다면»(가정, walk-forward) + 교차 적중 분석.
      # append-only: 이미 채점된 행은 보존하고 다시 계산한 값이 다르면 ::warning(결정성 감시). 캐시 재사용.
      - name: 모의 원장 적재 (brief/sim-*.json)
        id: backfill
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/backfill.mjs --root . --out . --cache /tmp/lab-data.json 2> >(tee /tmp/backfill.err >&2) || {
            echo "::error title=backfill 실패::$(tail -c 1800 /tmp/backfill.err | tr -s '\r\n' '  ')"; exit 1; }

      # 모의 원장을 페이지 없이 독립 구현으로 다시 계산해 대조한다(채점·누적·교차 개수·라이브 동일성).
      - name: 모의 원장 독립 검증
        id: checksim
        if: steps.backfill.outcome == 'success'
        continue-on-error: true
        run: node scripts/check-sim.mjs --root . --cache /tmp/lab-data.json

      # 추첨순서(공이 나온 순서) 자동 누적 — 외부 공개 출처에서 빠진 회차만 받아 공식 당첨번호 집합과 대조 후 추가.
      - name: 추첨순서 누적 (lotto-order.json)
        continue-on-error: true
        run: node scripts/fetch-order.mjs --out lotto-order.json --cache /tmp/lab-data.json

      # 앞 단계가 받아 둔 데이터를 재사용한다(동행복권 추가 호출 없음)
      - name: 로또 전 회차 스냅샷 (lotto-history.json)
        continue-on-error: true
        run: node scripts/fetch-history.mjs --cache /tmp/lab-data.json

      # 갈래 배치 독립 검증 — 이번 주 추천 10줄(A~E + F~J)이 45개 번호를 모두 나눠 쓰고 어느 두 줄도 2개 이상 겹치지 않는지
      # 산출 JSON 만으로 다시 센다(index.html 을 쓰지 않음). layout 이 없거나 legacy 회차면 «건너뜀» 으로 통과한다.
      # 브리핑 산출은 매 실행 덮어쓰는 파일이라 일지처럼 되돌리지 않고, 실패하면 끝쪽 «갈래 배치 실패 표시» 로 잡을 빨갛게 한다.
      - name: 갈래 배치 독립 검증
        id: checkspread
        if: steps.brief.outcome == 'success'
        continue-on-error: true
        run: node scripts/check-spread.mjs --summary brief/latest-summary.json --week brief/week.json --history lotto-history.json

      # 매매 일지 — lotto-history.json 만으로 최근 50회 재현 + 다음 회차 제시(append-only). Playwright·외부 접속 없음.
      - name: 매매 일지 (brief/trade-lotto.json)
        id: trade
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/trade-ledger.mjs --root . --history lotto-history.json --out brief/trade-lotto.json 2> >(tee /tmp/trade.err >&2) || {
            echo "::error title=trade-ledger 실패::$(tail -c 1800 /tmp/trade.err | tr -s '\r\n' '  ')"; exit 1; }

      # 엔진 코드를 쓰지 않는 독립 재계산 + 누수·결정성 탐침 + append-only(HEAD 대조)
      - name: 매매 일지 독립 검증
        id: checktrade
        if: steps.trade.outcome == 'success' && steps.trade.outputs.wrote == 'true'
        continue-on-error: true
        run: node scripts/check-trade.mjs --root . --file brief/trade-lotto.json --history lotto-history.json --prev-git HEAD

      # 독립 검증이 거부한 일지는 커밋하지 않는다. 일지(journal.rows)는 append-only 이고 check-trade C10 은 HEAD 와만 비교하므로,
      # 잘못 쓰인 일지가 한 번 커밋되면 다음 주에는 그 상태가 기준이 되어 통과하고 잘못이 영구히 굳는다.
      # 그래서 검증이 실패하면 일지 파일만 HEAD 의 것으로 되돌린다(HEAD 에 없으면 — 첫 실행 — 지운다).
      # 브리핑 등 다른 산출물은 그대로 커밋되고, 아래 «매매 일지 실패 표시» 가 잡을 실패로 표시한다.
      - name: 매매 일지 검증 실패 시 되돌림
        if: steps.checktrade.outcome == 'failure'
        run: git checkout HEAD -- brief/trade-lotto.json 2>/dev/null || rm -f brief/trade-lotto.json

      # 학습 장부 — 낙첨 분석(이번 주 추천 10줄 vs 같은 주 무작위 대조군) + 관문 있는 학습 실험실(후보 신호 사전 등록). append-only.
      # 주간 브리핑(latest-summary.json)·모의 원장(sim-lotto.json)·로또 전 회차 스냅샷 뒤여야 한다. Playwright·외부 접속 없음.
      - name: 학습 장부 (brief/learn-lotto.json)
        id: learn
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/learn-ledger.mjs --root . --history lotto-history.json --summary brief/latest-summary.json --sim brief/sim-lotto.json --out brief/learn-lotto.json 2> >(tee /tmp/learn.err >&2) || {
            echo "::error title=learn-ledger 실패::$(tail -c 1800 /tmp/learn.err | tr -s '\r\n' '  ')"; exit 1; }

      - name: 학습 장부 독립 검증
        id: checklearn
        if: steps.learn.outcome == 'success' && steps.learn.outputs.wrote == 'true'
        continue-on-error: true
        run: node scripts/check-learn.mjs --root . --file brief/learn-lotto.json --history lotto-history.json --summary brief/latest-summary.json --sim brief/sim-lotto.json --prev-git HEAD

      # 매매 일지와 같은 이유로 독립 검증이 거부한 장부만 HEAD 로 되돌린다(HEAD 에 없으면 — 첫 실행 — 지운다).
      - name: 학습 장부 검증 실패 시 되돌림
        if: steps.checklearn.outcome == 'failure'
        run: git checkout HEAD -- brief/learn-lotto.json 2>/dev/null || rm -f brief/learn-lotto.json

      # 당첨금 학습 — 등수별 당첨자 수로 인기 예측을 다시 학습하는 그림자 후보를 사전 등록하고 지금 모형과 견준다(추천은 바꾸지 않음).
      # 순위 추적(rank-params 갱신)·로또 전 회차 스냅샷 뒤여야 한다. Playwright·외부 접속 없음.
      - name: 당첨금 학습 (brief/pop-learn-lotto.json)
        id: poplearn
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/pop-learn.mjs --root . --history lotto-history.json --params brief/rank-params-lotto.json --out brief/pop-learn-lotto.json 2> >(tee /tmp/poplearn.err >&2) || {
            echo "::error title=pop-learn 실패::$(tail -c 1800 /tmp/poplearn.err | tr -s '\r\n' '  ')"; exit 1; }

      - name: 당첨금 학습 독립 검증
        id: checkpoplearn
        if: steps.poplearn.outcome == 'success' && steps.poplearn.outputs.wrote == 'true'
        continue-on-error: true
        run: node scripts/check-pop-learn.mjs --root . --file brief/pop-learn-lotto.json --history lotto-history.json --params brief/rank-params-lotto.json --prev-git HEAD

      - name: 당첨금 학습 검증 실패 시 되돌림
        if: steps.checkpoplearn.outcome == 'failure'
        run: git checkout HEAD -- brief/pop-learn-lotto.json 2>/dev/null || rm -f brief/pop-learn-lotto.json

      # 결과 요약을 notice 주석으로 남긴다(공개 API 로 확인 가능). dev 브랜치 통합 테스트의 판정 근거.
      # 주석 하나에 3,500자 안쪽 — 넘치면 JSON 이 잘려 읽을 수 없으므로 넷으로 나누고(브리핑 · 검증 · 연금 · 원장),
      # 그래도 길면 더 짧은 모양으로 바꿔 싣는다. 스크립트는 따옴표 heredoc 이라 셸이 $·따옴표를 건드리지 않는다.
      - name: 결과 요약
        if: always()
        continue-on-error: true
        run: |
          node - <<'JS'
          const fs=require('fs'); const j=f=>{try{return JSON.parse(fs.readFileSync(f,'utf8'))}catch(e){return null}};
          const s=j('brief/latest-summary.json')||{}, v=j('brief/validation.json')||{}, led=j('brief/purchases.json')||{};
          const V=v.lotto||{}, per=V.per||{}, PN=v.pension||{}, PS=PN.structure||{};
          const pick=(o,ks)=>o?Object.fromEntries(ks.filter(k=>o[k]!==undefined).map(k=>[k,o[k]])):null;
          /* 후보를 차례로 시도해 3,500자 안에 드는 첫 JSON 을 싣는다(마지막 후보도 넘치면 자른다). %·줄바꿈은 명령 이스케이프 */
          const note=(title,...cands)=>{
            let t='';
            for(const o of cands){ t=JSON.stringify(o); if(t.length<3500) break; }
            console.log('::notice title='+title+'::'+t.slice(0,3499).replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A'));
          };
          const side=(x,n)=>x&&{last:x.last,next:x.next,picks:(x.picks||[]).slice(0,n)};
          note('brief', {date:s.date,pension:side(s.pension,10),lotto:side(s.lotto,10)},
                        {date:s.date,pension:side(s.pension,5),lotto:side(s.lotto,5)});
          const ck=V.checks||{}, K=['zGain','payoutGain','pAnyTheory','anyHitRate','ev5Model','evVsRandomPct','ovMax','degraded','hitsPerGame'];
          const ms={payoutGain:per.minshare?per.minshare.payoutGain:null};
          note('validation',
            {generated:v.generated,current:V.current,checks:ck,portfolio:per.portfolio,minshare:ms,random:per.random},
            {generated:v.generated,current:V.current,
             checks:Object.fromEntries(Object.entries(ck).map(([k,c])=>[k,c&&c.ok===false?{ok:false,soft:!!c.soft,value:c.value}:(c&&c.ok)])),
             portfolio:pick(per.portfolio,K),minshare:ms,random:pick(per.random,K)});
          const sm=m=>pick(PS[m],['n','anyHitRate','pAnyTheory','within99','meanRet','distinctFail']);
          const rp=(PS.repro||[]).map(x=>({ep:x.ep,rule:x.rule,table:x.table,order:x.order,set:x.set}));
          const pst={from:PS.from,to:PS.to,mode:PS.mode,dist:PS.dist,spread:sm('spread'),set:sm('set'),legacy:sm('legacy')};
          const pbase={tested:PN.tested,sig:PN.sig,sigCorrected:PN.sigCorrected,controlSig:PN.controlSig,weeklyMode:PN.weeklyMode,structure:pst};
          note('pension', {...pbase,repro:rp},
                          {...pbase,repro:{n:rp.length,ok:rp.filter(x=>x.set).length,fail:rp.filter(x=>!x.set).slice(-20)}});
          const pend=(led.rounds||[]).filter(r=>r.status==='pending');
          note('ledger', {updated:led.updated,totals:v.ledger||null,pending:pend.map(r=>({kind:r.kind,round:r.round,rule:r.rule,mode:r.mode,picks:r.picks}))},
                         {updated:led.updated,totals:v.ledger||null,pending:pend.map(r=>({kind:r.kind,round:r.round,rule:r.rule,mode:r.mode}))});
          /* 모의 원장(sim-*) · 추첨순서(lotto-order.json) 요약 */
          const sl=j('brief/sim-lotto.json'), sp=j('brief/sim-pension.json'), od=j('lotto-order.json');
          const simS=x=>{ if(!x) return null; const rows=x.rows||[], S=x.summary||{}, C=S.cross||{}, K=C.classes||{};
            const any=x.kind==='lotto'?'ge3':'any';
            const cls=c=>c&&{obs:(c.obs||{})[any],exp:(c.exp||{})[any],sd:(c.sd||{})[any],pMC:(c.pMC||{})[any]};
            return {from:x.from, to:x.to, rows:rows.length, weeks:S.weeks, spend:S.spend, ret:S.ret, roi:S.roi, median:S.median,
                    ranks:S.ranks, anyWeeks:S.anyWeeks, expAnyWeeks:S.exp&&S.exp.anyWeeks, checks:x.checks&&{live:x.checks.live&&x.checks.live.ok,
                    determinism:x.checks.determinism&&{mismatch:(x.checks.determinism.mismatch||[]).length,regrade:(x.checks.determinism.regrade||[]).length}},
                    cross:{replay:C.replay, before:cls(K.before), same:cls(K.same), after:cls(K.after), notable:(C.notable||[]).length}}; };
          const ok=od&&od.rounds?Object.keys(od.rounds).map(Number):[];
          /* 당첨 순위 추적 요약 — 모델별 평균 백분위(기대 0.5) · KS p · 상위 10% 관측/기대 */
          const rl=j('brief/rank-lotto.json'), rpn=j('brief/rank-pension.json');
          const rkS=x=>{ if(!x||!x.summary) return null; const M=x.summary.models||{};
            return {from:x.from, latest:x.latest, rows:(x.rows||[]).length, next:x.next&&x.next.round,
                    models:Object.fromEntries(Object.entries(M).map(([k,m])=>[k,{mean:m.meanPct&&+m.meanPct.toFixed(3),ks:m.ks&&+(+m.ks.p).toFixed(3),
                      top10:m.top&&m.top['10%'], exp10:m.topExp&&m.topExp['10%'], band:m.band&&{hits:m.band.hits,n:m.band.n,p:m.band.p}}]))}; };
          note('rank', {lotto:rkS(rl), pension:rkS(rpn)});
          note('sim', {lotto:simS(sl), pension:simS(sp),
                       order:od?{source:od.source&&od.source.name, rounds:ok.length, max:ok.length?Math.max(...ok):null}:null});
          /* 갈래 배치 · 학습 장부 · 당첨금 학습 요약 */
          const ln=j('brief/learn-lotto.json'), pl=j('brief/pop-learn-lotto.json');
          const jr=x=>{ const r=(x&&x.journal&&x.journal.rows)||[], t=r[r.length-1];
            return {rows:r.length, from:x&&x.journal&&x.journal.from, last:t&&{r:t.r,status:t.status,late:!!t.late}}; };
          note('learn', {layout:(s.lotto||{}).layout||null, learn:ln&&{...jr(ln),gate:ln.summary&&ln.summary.gate},
                         poplearn:pl&&{...jr(pl),gate:pl.gate&&{status:pl.gate.status,n:pl.gate.n,adopt:pl.gate.adopt}}},
                        {layout:(s.lotto||{}).layout||null, learn:ln&&jr(ln), poplearn:pl&&jr(pl)});
          JS

      - name: 결과 커밋
        id: commit
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- brief.html brief validate.html lotto-history.json lotto-order.json
          if git diff --cached --quiet; then
            echo "변경 없음"; echo "committed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          P=$(node -e "const s=require('./brief/latest-summary.json');console.log(s.pension.next)")
          L=$(node -e "const s=require('./brief/latest-summary.json');console.log(s.lotto.next)")
          git commit -q -m "auto: 연금 ${P}회 · 로또 ${L}회 추천 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)"
          # 그 사이 사용자가 push 했으면 위에 다시 얹는다. 결과물 충돌은 방금 계산한 값(-X theirs)을 남긴다.
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break
            sleep $((i*5))
          done
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: 순위 추적 실패 표시
        if: steps.ranktrack.outcome == 'failure' || steps.checkrank.outcome == 'failure' || steps.ranktiers.outcome == 'failure' || steps.checktiers.outcome == 'failure'
        run: echo "::error::순위 추적(rank-track/check-rank/rank-tiers/check-tiers) 단계가 실패했습니다 — 브리핑·검증은 커밋됨" && exit 1

      - name: 모의 원장 실패 표시
        if: steps.backfill.outcome == 'failure' || steps.checksim.outcome == 'failure'
        run: echo "::error::모의 원장(backfill/check-sim) 단계가 실패했습니다 — 브리핑·검증은 커밋됨" && exit 1

      - name: 검증 보드 실패 표시
        if: steps.validate.outcome == 'failure'
        run: echo "::error::검증 보드(validate.mjs) 가 실패했습니다 — 브리핑은 커밋됨" && exit 1

      - name: 매매 일지 실패 표시
        if: steps.trade.outcome == 'failure' || steps.checktrade.outcome == 'failure'
        run: echo "::error::매매 일지(trade-ledger/check-trade) 단계가 실패했습니다 — 브리핑·검증은 커밋됨, 독립 검증이 실패한 일지는 HEAD 로 되돌려 커밋하지 않음" && exit 1

      - name: 갈래 배치 실패 표시
        if: steps.checkspread.outcome == 'failure'
        run: echo "::error::갈래 배치(check-spread) 검증이 실패했습니다 — 브리핑은 커밋됨, 이번 주 10줄이 구조를 못 지켰거나 산출이 어긋났습니다" && exit 1

      - name: 학습 장부 실패 표시
        if: steps.learn.outcome == 'failure' || steps.checklearn.outcome == 'failure'
        run: echo "::error::학습 장부(learn-ledger/check-learn) 단계가 실패했습니다 — 브리핑·검증은 커밋됨, 독립 검증이 실패한 장부는 HEAD 로 되돌려 커밋하지 않음" && exit 1

      - name: 당첨금 학습 실패 표시
        if: steps.poplearn.outcome == 'failure' || steps.checkpoplearn.outcome == 'failure'
        run: echo "::error::당첨금 학습(pop-learn/check-pop-learn) 단계가 실패했습니다 — 브리핑·검증은 커밋됨, 독립 검증이 실패한 장부는 HEAD 로 되돌려 커밋하지 않음" && exit 1

  deploy:
    needs: compute
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # deploy 는 compute 가 실패해도 도는 구조(always)라 여기서도 막아야 금지 문자열이 사이트로 나가지 않는다.
      # 시크릿·변수는 compute 의 이름 검사와 같다.
      - name: 이름 검사 (scripts/check-names.mjs)
        env:
          CHECK_NAMES_LIST: ${{ secrets.CHECK_NAMES_LIST }}
          CHECK_NAMES_REQUIRE: ${{ vars.CHECK_NAMES_REQUIRE }}
        run: node scripts/check-names.mjs

      # enablement: true → 저장소에 Pages 가 아직 켜져 있지 않으면 워크플로가 직접 켠다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
